[package]
name = "ozzel"
version = "0.1.7"
edition = "2024"
description = "A two-pane TUI file manager"
license = "MIT"
repository = "https://github.com/m-tkg/Ozzel"
readme = "README.md"
keywords = ["tui", "file-manager", "terminal", "filer"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "ozzel"
path = "src/lib.rs"

[[bin]]
name = "ozzel"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
# Default features (no `bzip2-sys`) build against the pure-Rust
# `libbz2-rs-sys` backend, not the real C libbzip2 — same "no C toolchain
# dependency" bar as everything else here. See virtual_dir.rs.
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
# Already pulled in transitively by `zip` (pure-Rust `miniz_oxide`/`zlib-rs`
# backends, no C zlib) — declared directly too since virtual_dir.rs's
# tar.gz support uses it on its own, outside of anything `zip` does.
flate2 = "1.1.9"
# Pure-Rust LZMA/LZMA2/XZ codec (`#![forbid(unsafe_code)]`) — used only
# for decoding (`.tar.xz`/`.txz`), never encoding. See virtual_dir.rs.
lzma-rs = "0.3.0"
open = "5.4.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
# Format-preserving TOML editor — used only by the settings screen
# (src/settings.rs) to surgically update a single changed key in the
# user's real config.toml without disturbing its comments/layout/
# unrelated formatting. `toml` (above) stays the read-only parser
# everywhere else.
toml_edit = "0.25.13"
trash = "5.2.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "benchmarks"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.189"
