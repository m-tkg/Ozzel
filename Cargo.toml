[package]
name = "ozzel"
version = "0.1.2"
edition = "2024"
description = "A two-pane TUI file manager"
license = "MIT"
repository = "https://github.com/m-tkg/Ozzel"
readme = "README.md"
keywords = ["tui", "file-manager", "terminal", "filer"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
# Default features (no `bzip2-sys`) build against the pure-Rust
# `libbz2-rs-sys` backend, not the real C libbzip2 — same "no C toolchain
# dependency" bar as everything else here. See virtual_dir.rs.
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
# Already pulled in transitively by `zip` (pure-Rust `miniz_oxide`/`zlib-rs`
# backends, no C zlib) — declared directly too since virtual_dir.rs's
# tar.gz support uses it on its own, outside of anything `zip` does.
flate2 = "1.1.9"
# Pure-Rust LZMA/LZMA2/XZ codec (`#![forbid(unsafe_code)]`) — used only
# for decoding (`.tar.xz`/`.txz`), never encoding. See virtual_dir.rs.
lzma-rs = "0.3.0"
open = "5.4.0"
ratatui = "0.29"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
trash = "5.2.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
ureq = { version = "2", features = ["tls"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
