[package]
name = "ozzel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.4"
trash = "5.2.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
