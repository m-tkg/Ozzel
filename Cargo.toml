[package]
name = "ozzel"
version = "0.1.16"
edition = "2024"
description = "A two-pane TUI file manager"
license = "MIT"
repository = "https://github.com/m-tkg/Ozzel"
readme = "README.md"
keywords = ["tui", "file-manager", "terminal", "filer"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "ozzel"
path = "src/lib.rs"

[[bin]]
name = "ozzel"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
# Default features (no `bzip2-sys`) build against the pure-Rust
# `libbz2-rs-sys` backend, not the real C libbzip2 — same "no C toolchain
# dependency" bar as everything else here. See virtual_dir.rs.
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
# Already pulled in transitively by `zip` (pure-Rust `miniz_oxide`/`zlib-rs`
# backends, no C zlib) — declared directly too since virtual_dir.rs's
# tar.gz support uses it on its own, outside of anything `zip` does.
flate2 = "1.1.9"
# Cross-platform free-disk-space lookup (statvfs / GetDiskFreeSpaceExW
# behind one call) — used only for the pane header's "NN GB Free" cell.
# Pure Rust over the platform APIs, no C toolchain.
fs4 = "0.13"
# Pure-Rust LZMA/LZMA2/XZ codec (`#![forbid(unsafe_code)]`) — used only
# for decoding (`.tar.xz`/`.txz`), never encoding. See virtual_dir.rs.
lzma-rs = "0.3.0"
open = "5.4.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# OS-level filesystem change notification (inotify on Linux, FSEvents on
# macOS, ReadDirectoryChangesW on Windows) behind one API — what makes a
# pane pick up a file added or changed by Finder/another shell without the
# user pressing C-r. Pure Rust over the platform APIs (the macOS backend
# links the system CoreServices framework; no C toolchain, same bar as
# every other dependency here). Chosen over polling each pane's directory
# on a timer, which on a large directory means a full `read_dir` plus a
# `stat` per entry every tick, forever, just to notice nothing changed.
notify = "8.2.0"
# Pure-Rust text diffing (Myers) — used only by the `=` (diff) action to
# build the unified diff the viewer renders. Chosen over shelling out to
# `git diff --no-index` (works without git, no exit-code/quoting quirks)
# and over a hand-rolled LCS (no reason to re-derive Myers).
similar = "2.6.0"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
# Format-preserving TOML editor — used only by the settings screen
# (src/settings.rs) to surgically update a single changed key in the
# user's real config.toml without disturbing its comments/layout/
# unrelated formatting. `toml` (above) stays the read-only parser
# everywhere else.
toml_edit = "0.25.13"
trash = "5.2.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
walkdir = "2.5.0"
# `aes-crypto` (pure Rust: aes/hmac/pbkdf2/sha1/zeroize — no C toolchain,
# same bar as every other dependency) enables reading AES-encrypted zips;
# legacy ZipCrypto decryption needs no feature at all.
zip = { version = "8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "benchmarks"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.189"
