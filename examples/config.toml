# ozzel サンプル設定ファイル
#
# 配置先（存在しない場合はデフォルト設定で起動します）:
#   Linux / macOS: $XDG_CONFIG_HOME/ozzel/config.toml
#                  （$XDG_CONFIG_HOME 未設定時は ~/.config/ozzel/config.toml）
#   Windows:       %APPDATA%\ozzel\config\config.toml
#
# このファイルをそのままコピーして使う場合は、コメントアウトされた行を
# 必要に応じて有効化（先頭の # を削除）してください。すべての項目は省略可能です。
#
# ozzel を起動して `,` キーを押すと、このファイルとまったく同じ内容の
# テンプレートから設定ファイルを新規作成し、エディタで開きます（既に
# 存在する場合はそのまま開くだけで、上書きはしません）。保存してエディタを
# 終了すると、再起動なしでその場に設定が反映されます。

# --- 削除の挙動 -------------------------------------------------------
# "trash"（デフォルト）: OS のゴミ箱へ移動する
# "permanent": 確認後に完全削除する（ゴミ箱を経由しない）
#
# Linux でのゴミ箱移動は XDG 対応デスクトップ環境が前提です。対応していない
# 環境では失敗し、エラーを表示します（無言で完全削除にフォールバックしません）。
delete_behavior = "trash"

# --- ホームディレクトリ ------------------------------------------------
# `~` キーで移動する先。省略時は OS のホームディレクトリが使われます。
# home = "/Users/you/projects"

# --- エディタ -----------------------------------------------------------
# `e` キーで開くエディタコマンド。省略時は環境変数 $EDITOR が使われ、
# それも未設定の場合はエラーになります。
# editor = "vim"

# --- コピー・移動の確認 -------------------------------------------------
# デフォルト true: 削除と同様、コピー・移動も実行前に確認ダイアログを
# 表示します（`Copy 3 item(s) -> /dest? (y/n)`）。false にすると、
# 上書き衝突がない限り確認なしで即実行します（衝突がある場合は
# false でも常に確認ダイアログが出ます — 無条件でスキップはされません）。
# confirm_operations = false

# --- 色 -------------------------------------------------------------------
[colors]
# カーソル行の背景色。名前付きの ratatui カラー（大文字小文字を区別しない。
# 例: "red", "light_green", "lightgreen" はどちらも同じ色）、または
# "#RRGGBB" 形式の16進数カラーコードを指定できます。不正な値を指定した場合は
# 他の設定エラーと同様に起動時にエラーとなります。
#
# デフォルトは薄い緑（#90EE90）です。トゥルーカラー非対応のターミナルでは
# 正しく表示されないことがあるため、その場合は ANSI の近似色として
# cursor = "light_green" を指定してください。
cursor = "#90EE90"

# 非アクティブ側ペインのカーソル行の背景色。指定できる値は cursor と同じです。
# デフォルトは白（"white"）。アクティブ側の緑カーソルと見分けやすくするための
# ものです。
cursor_inactive = "white"

# 非アクティブ側ペインの行（カーソル行・枠線・タイトルを含む全体）を薄暗く
# 表示するかどうか。デフォルトは true。false にすると両ペインとも常に
# 通常の明るさで表示されます。
dim_inactive = true

# --- キーバインドの上書き -----------------------------------------------
# 左辺: キーの組み合わせ（"C-" = Ctrl, "S-" = Shift, "A-" = Alt を
#        プレフィックスとして重ねられます。例: "C-r", "S-tab"）
# 右辺: アクション名（snake_case）。"none" を指定するとそのキーの
#        割り当てを解除します。
#
# デフォルトのキーバインドについては README.md の「キーバインド一覧」を
# 参照してください。
[keys]
# 例: Ctrl+C にコピーを割り当てる（デフォルトの終了キーと衝突するので
# 変更する場合は、終了用のキーを別途 "q" などに残しておくことを推奨します）
# "C-c" = "copy"

# 例: "q" 単体での終了を無効化し、誤操作を防ぐ
# "q" = "none"

# 例: vi 風に j/k でカーソル移動を追加する
# "j" = "cursor_down"
# "k" = "cursor_up"

# 例: x/o に元の「OS既定アプリで開く」を戻す（デフォルトでは未割り当て）
# "x" = "open_default"

# 使用できるアクション名の一覧:
# cursor_up, cursor_down, focus_left, focus_right, page_up, page_down,
# top, bottom, switch_pane, enter, parent, cycle_sort, toggle_hidden,
# swap_panes, refresh, mark, mark_all, rename, mkdir, delete, copy, move,
# filter, clear_filter, zip_marked, unzip, history_jump, bookmark_jump,
# bookmark_add, go_home, command_line, open_editor, open_default, view,
# help, quit

# --- キーバインドの上書き（逆向き記法） ---------------------------------
# [keys] とは逆に、左辺がアクション名、右辺がキーの組み合わせの配列です。
# 1つのアクションに複数のキーをまとめて割り当てたいときに便利です。
# [keys] より後に適用されるため、両方が同じキーに言及した場合は
# こちらが勝ちます。"none"（割り当て解除）はここにはありません —
# 解除は引き続き [keys] 側で行ってください。
[bindings]
# 例: rename に r と Shift+r の両方を割り当てる（実はデフォルトと同じ内容）
# rename = ["r", "S-r"]

# 例: quit に q・Ctrl+C に加えて Ctrl+q も割り当てる
# quit = ["q", "C-c", "C-q"]
