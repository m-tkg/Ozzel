# ozzel sample configuration file
#
# Location (if it doesn't exist, ozzel starts with default settings):
#   Linux / macOS: $XDG_CONFIG_HOME/ozzel/config.toml
#                  (~/.config/ozzel/config.toml if $XDG_CONFIG_HOME is unset)
#   Windows:       %APPDATA%\ozzel\config\config.toml
#
# If you copy this file as-is to use it, enable the commented-out lines
# as needed (remove the leading #). All items are optional.
#
# Launch ozzel and press the `,` key to create a new config file from a
# template with exactly the same content as this file, and open it in an
# editor (if one already exists, it just opens it as-is without
# overwriting it). Save and quit the editor, and the settings take
# effect immediately, without restarting.

# --- Delete behavior ----------------------------------------------------
# "trash" (default): move to the OS trash/recycle bin
# "permanent": permanently delete after confirmation (bypasses the trash)
#
# Moving to the trash on Linux assumes an XDG-compliant desktop
# environment. On unsupported environments it fails and shows an error
# (it does not silently fall back to permanent deletion).
delete_behavior = "trash"

# --- Home directory ------------------------------------------------------
# The destination for the `~` key. If omitted, the OS home directory is
# used. A leading `~` (either `~` alone, or `~/` followed by a path) is
# expanded, so you can also write something like home = "~/work"
# (the `~user` form is not supported).
# home = "/Users/you/projects"

# --- Editor ---------------------------------------------------------------
# The editor command opened with the `e` key. If omitted, the $EDITOR
# environment variable is used, and it is an error if that is also unset.
# editor = "vim"

# --- Copy/move confirmation -----------------------------------------------
# Default true: like delete, copy/move also show a confirmation dialog
# before executing (`Copy 3 item(s) -> /dest? (y/n)`). Set to false to
# execute immediately without confirmation, unless there is an overwrite
# conflict (if there is a conflict, the confirmation dialog is always
# shown even with false — it is never skipped unconditionally).
# confirm_operations = false

# --- Confirmation on quit ---------------------------------------------------
# Default true: shows a "Quit ozzel? (y/n)" confirmation before quitting
# with `q`/Ctrl+C, even when there are no running tasks. Set to false to
# quit immediately without confirmation (the confirmation shown while a
# task is running is always displayed regardless of this setting).
confirm_quit = true

# --- Writing out the directory on quit (--cwd-file) -----------------------
# Default true: if launched with `ozzel --cwd-file <path>`, writes the
# directory of the focused pane to <path> on quit. Set to false to never
# write it out at all, even if --cwd-file is specified (a full opt-out
# for when you want to use --cwd-file for another purpose). See the
# "Making the shell's cd follow on quit" section of README.md for how to
# wire up the shell side.
quit_cd = true

# --- When file name search runs --------------------------------------------
# Default true: the `g` file name search (recursive search under the
# current directory) updates its results on every keystroke
# (incremental). Set to false to keep showing the previous results while
# typing, and only run the search when you press Enter (for cases where
# re-matching on every keystroke is heavy on a huge tree).
file_search_incremental = true

# --- Natural (digit-as-number) sort ------------------------------------------
# Default true: name sorting compares digit runs as numbers, so
# file2.txt comes before file10.txt (the ordering most modern file
# managers use). Set to false for strict lexicographic order
# (file10.txt before file2.txt).
# natural_sort = true

# --- Cursor wrap-around ------------------------------------------------------
# Default false: single-step cursor movement (Up/Down) stops at the top
# and bottom of the list. Set to true to wrap around instead (one step
# past the last row lands on the first, and vice versa). PageUp/
# PageDown, Home/End, and the mouse wheel always stop at the edges
# regardless of this setting.
# cursor_wrap = true

# --- Size column format ------------------------------------------------------
# How the size column renders file sizes:
#   "human" (default): 1.5K / 2.3M style
#   "bytes": raw byte count (1536)
#   "bytes_grouped": byte count with thousands separators (1,536)
# The `v` key cycles through these at runtime and writes the choice back
# here, so this value normally maintains itself.
# size_format = "human"

# --- Shell mode for the : command --------------------------------------------
# Default false: `:` commands run in a non-interactive shell (unix:
# $SHELL -c, Windows: %COMSPEC% /C). A non-interactive shell does not
# load .zshrc/.bashrc, so aliases and shell functions meant for
# interactive shells cannot be used. Set to true to launch with -i
# ($SHELL -i -c ...), which loads the rc file so aliases and functions
# become available. In exchange, every command execution incurs the
# cost of loading the rc file and its side effects (prompt
# initialization output, interactive aliases like rm -i being enabled,
# etc.). Do not enable this if your rc file does something like exec
# tmux. Only takes effect on unix; ignored on Windows.
command_line_interactive = false

# --- Mouse operations -------------------------------------------------------
# Default true: enables pane/cursor movement by click, scrolling with
# the wheel, range toggle-marking by drag (flips the mark state of the
# lines passed over), and open on double-click. Set to false to not
# enable mouse capture at all (the terminal's native text selection can
# then be used as-is). If you want to use the terminal's native text
# selection while keeping this true, in most terminals you can select
# by dragging while holding Shift (a common convention for TUI apps).
mouse = true

# --- Permissions column ------------------------------------------------------
# Default true: shows a permissions column next to each row's name, in
# `drwxr-xr-x` format (on Windows, a simplified display such as
# `rw-`/`ro-`/`rwd`). When the pane is narrow, this column is
# automatically hidden before the name column gets squeezed. Set to
# false to always hide it.
show_permissions = true

# --- External viewer per extension ------------------------------------------
# You can specify, per extension, an external command to use instead of
# the built-in viewer when opening with `open` (Enter/o). Keys are
# lowercase extensions without a dot, and values are shell commands. If
# the command contains "{}", the path is embedded there (shell-quoted);
# otherwise the path is appended at the end. Extensions with no
# corresponding entry (or files with no extension) continue to be
# opened with the built-in viewer as before. This does not apply to
# files inside a Virtual Directory (zip), since no real file exists
# there — it always falls back to the built-in viewer.
# [viewers]
# md = "glow {}"    # Display Markdown with glow
# log = "less {}"   # Display log files with less
# jpg = "open {}"   # Open images with the OS's default GUI app (macOS example)

# --- Colors -----------------------------------------------------------------
[colors]
# The background color of the cursor row. You can specify a named
# ratatui color (case-insensitive; e.g. "red", "light_green", and
# "lightgreen" are all the same color), or a hex color code in
# "#RRGGBB" format. An invalid value is an error at startup, like any
# other configuration error.
#
# The default is light green (#90EE90). This may not display correctly
# on terminals without true color support, in which case specify
# cursor = "light_green" as an approximate ANSI color.
cursor = "#90EE90"

# The background color of the cursor row in the inactive pane. Accepts
# the same values as cursor. The default is white ("white"), making it
# easy to distinguish from the active pane's green cursor.
cursor_inactive = "white"

# Whether to dim the inactive pane's rows (the whole pane, including
# the cursor row, border, and title). The default is true. Set to false
# to always display both panes at normal brightness. The cursor row
# alone is dimmed by darkening its background color toward black
# (since a terminal's SGR dim attribute barely affects the background
# color), while other rows are left to the terminal's own dim display.
dim_inactive = true

# Row colors per entry type (applied to rows other than the cursor row;
# accepts the same values as cursor). If a row matches multiple types
# (e.g. a hidden directory), only one color is used, with priority
# hidden > executable > directory. The color of a marked row (yellow)
# always takes priority over these.
directory = "cyan"
hidden = "red"
executable = "yellow"

# --- Keybinding overrides -------------------------------------------------
# Left side: a key combination ("C-" = Ctrl, "S-" = Shift, "A-" = Alt
#        can be stacked as prefixes; e.g. "C-r", "S-tab")
# Right side: an action name (snake_case). Specifying "none" clears the
#        assignment for that key.
#
# See the "Keybinding list" section of README.md for the default
# keybindings.
[keys]
# Example: assign copy to Ctrl+C (this conflicts with the default quit
# key, so if you make this change, it's recommended to leave a
# separate key such as "q" for quitting)
# "C-c" = "copy"

# Example: disable quitting with "q" alone, to prevent accidental operation
# "q" = "none"

# Example: assign the original "open with the OS's default app" to x
# (unassigned by default; x is an unused key by default)
# "x" = "open_default"

# List of available action names:
# cursor_up, cursor_down, focus_left, focus_right, page_up, page_down,
# top, bottom, switch_pane, open, parent, cycle_sort, toggle_hidden,
# swap_panes, refresh, mark, mark_all, rename, mkdir, delete, copy, move,
# duplicate, copy_path, filter, clear_filter, jump_search, file_search,
# zip_marked, unzip,
# cancel_tasks, history_jump, history_back, history_forward, bookmark_jump,
# bookmark_add, go_home, command_line, open_editor, open_default,
# help, edit_config, show_log, function_list, settings, quit

# --- Keybinding overrides (reverse notation, full list of default keybindings) ---
# Unlike [keys], the left side is the action name and the right side is
# an array of key combinations. Useful when you want to assign multiple
# keys to a single action at once. This is applied after [keys], so if
# both mention the same key, this one wins.
#
# Below is a full dump of the current default keybindings (so that you
# can see and change all keybindings just by editing here directly,
# without rebuilding `ozzel`). Every line is active, so launching as-is
# does not change the behavior from before.
#
# Important: this [bindings] section is for "adding/overriding" only.
# Deleting a line does not remove that key's assignment (the code's
# default keeps taking effect). If you really want to disable a
# specific key, don't delete this line — instead specify "that key" =
# "none" in the [keys] section above (e.g. "q" = "none").
[bindings]
cursor_up = ["Up", "i"]
cursor_down = ["Down", "k"]
page_up = ["PageUp"]
page_down = ["PageDown"]
top = ["Home", "S-Up"]
bottom = ["End", "S-Down"]
switch_pane = ["Tab"]
focus_left = ["Left", "j"]
focus_right = ["Right", "l"]
open = ["Enter", "o"]
parent = ["Backspace"]
cycle_sort = ["s"]
sort_dialog = ["t"]
toggle_size_format = ["v"]
calc_dir_size = ["z"]
toggle_hidden = ["."]
swap_panes = ["w"]
refresh = ["C-r"]
mark = ["Space"]
mark_all = ["a"]
rename = ["R", "r"]
rename_marks = ["m"]
mkdir = ["K"]
delete = ["D", "d"]
copy = ["C"]
move = ["M"]
duplicate = ["c"]
copy_path = ["y"]
zip_marked = ["p"]
unzip = ["u"]
cancel_tasks = ["C-k"]
symlink = ["@"]
chmod = ["A"]
touch = ["T"]
file_info = ["I"]
filter = ["/", "f"]
clear_filter = ["Esc"]
jump_search = ["\\"]
file_search = ["g"]
history_jump = ["H"]
history_back = ["S-Left"]
history_forward = ["S-Right"]
bookmark_jump = ["b"]
bookmark_add = ["B"]
go_home = ["~"]
command_line = [":"]
open_editor = ["e"]
open_default = ["S-Enter"]
edit_config = [","]
help = ["?", "h"]
show_log = ["L"]
function_list = ["F"]
settings = ["S"]
quit = ["C-c", "q"]
